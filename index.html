  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0A0A0C;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 64px;
    }

    .logo {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -1px;

    }

    .logo span {

    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      padding: 8px 24px;
      font-size: 14px;
      font-weight: 500;
      color: #9A9AA4;
      margin-bottom: 32px;
    }

    .title {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin-bottom: 24px;
    }

    .subtitle {
      font-size: 18px;
      color: #9A9AA4;
      line-height: 1.6;
      max-width: 640px;
      margin: 0 auto;
    }

    /* Cards grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 32px;
      margin-bottom: 80px;
    }

       .card {
      background: rgba(18, 18, 24, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 40px 32px;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 20px;

      /* Maxim fix: убираем синий highlight при тапе/задержке/скролле на мобиле.
         Проблема: браузер по умолчанию подсвечивает <a> синим прямоугольником.
         Решение — 3 свойства из отраслевого стандарта (Apple, Stripe, Google). */
      -webkit-tap-highlight-color: transparent;  /* Убирает синий тап-highlight iOS/Android */
      -webkit-touch-callout: none;                /* Убирает контекстное меню при долгом тапе */
      user-select: none;                          /* Убирает выделение текста при задержке */
      -webkit-user-select: none;                  /* Префикс для Safari/старых WebKit */
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(234, 88, 12, 0.3);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.3);
    }

    /* Maxim fix: убираем синюю фокус-обводку после клика — у нас свой hover-эффект.
       Но НЕ убираем focus-visible — для клавиатурной навигации (a11y). */
    .card:focus {
      outline: none;
    }
    .card:focus-visible {
      outline: 2px solid rgba(234, 88, 12, 0.5);
      outline-offset: 2px;
    }

    .card-icon {
      width: 64px;
      height: 64px;
      background: rgba(234, 88, 12, 0.12);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon svg {
      width: 32px;
      height: 32px;
      stroke: #EA580C;
      stroke-width: 1.8;
      fill: none;
    }

    .card-title {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }

    .card-desc {
      font-size: 16px;
      color: #9A9AA4;
      line-height: 1.6;
    }

        .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #EA580C;
      margin-top: auto;     /* ← КЛЮЧ: прижимает CTA к низу карточки */
      padding-top: 12px;    /* ← Минимальный отступ от описания если карточка короткая */
    }

    .card-meta svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
    }
	
	    /* === Состояние «Скоро» для карточки в разработке === */
        .card.is-soon {
      cursor: pointer;
      position: relative;
    }
        .card.is-soon:hover {
      transform: translateY(-4px);
      border-color: rgba(234, 88, 12, 0.25);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.28);
    }
    .card.is-soon .card-icon,
    .card.is-soon .card-title,
    .card.is-soon .card-desc {
      opacity: 0.55;
      transition: opacity 0.3s ease;
    }
    .card.is-soon:hover .card-icon,
    .card.is-soon:hover .card-title,
    .card.is-soon:hover .card-desc {
      opacity: 0.7;
    }
    .card-soon-badge {
      position: absolute;
      top: 24px;
      right: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(234, 88, 12, 0.12);
      border: 1px solid rgba(234, 88, 12, 0.35);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #EA580C;
      text-transform: uppercase;
    }
    .card-soon-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #EA580C;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
       /* Maxim: после возврата кликабельности — CTA снова оранжевый как у всех */
    .card.is-soon .card-meta {
      color: #EA580C;
    }
    @media (prefers-reduced-motion: reduce) {
      .card-soon-badge::before {
        animation: none;
      }
    }

    /* === Бейдж «Для менеджеров RUSS» — состояние «внутренний инструмент» ===
       Maxim: отдельный класс от .card-soon-badge — это РАЗНЫЕ состояния:
       - card-soon-badge   = «скоро будет» (динамика, оранжевый, пульс)
       - card-internal-badge = «для своих» (статика, серый, без пульса)
       По Apple: цвет и поведение должны соответствовать смыслу. */
    .card-internal-badge {
      position: absolute;
      top: 24px;
      right: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #9A9AA4;
      text-transform: uppercase;
    }
    .card-internal-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9A9AA4;
      /* без анимации — это спокойное состояние, не событие */
    }

    /* Footer */
    .footer {
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 48px;
      margin-top: 20px;
    }

    .footer-text {
      font-size: 13px;

    @media (max-width: 768px) {

      .cards-grid {
        gap: 20px;
      }
      .card {
        padding: 28px 24px;
      }
      .card-title {
        font-size: 24px;
      }
      /* На мобиле бейджи чуть меньше — чтобы не залезали на иконку */
      .card-soon-badge,
      .card-internal-badge {
        top: 20px;
        right: 20px;
        padding: 5px 11px;
        font-size: 11px;
      }
    }
  </style>
